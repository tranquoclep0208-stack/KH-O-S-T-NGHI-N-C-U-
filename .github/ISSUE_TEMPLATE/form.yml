name: Khảo sát nghiên cứu
description: Tác động của AI cá nhân hóa và tích hợp đa kênh đến hành vi né tránh và chuyển đổi nhà bán lẻ
title: "[Khảo sát] "
body:
  - type: markdown
    attributes:
      value: |
        ## BẢNG CÂU HỎI KHẢO SÁT NGHIÊN CỨU
        **Đề tài:** Tác động của AI cá nhân hóa và tích hợp đa kênh đến hành vi né tránh và chuyển đổi nhà bán lẻ của người tiêu dùng.

        Câu trả lời chỉ phục vụ mục đích nghiên cứu. Lưu ý: phản hồi trên GitHub có thể hiển thị công khai cùng tên tài khoản của bạn.

        **Cách trả lời:** hãy chủ động chọn một đáp án ở MỖI câu. Nếu để trống, câu đó sẽ được ghi là chưa trả lời.
  - type: markdown
    attributes:
      value: |
        ## PHẦN I: CÂU HỎI SÀNG LỌC
  - type: dropdown
    id: sc1
    attributes:
      label: "SC1. Thương hiệu/chuỗi bán lẻ bạn mua hoặc nhận hàng trực tiếp tại cửa hàng trong 6 tháng qua"
      description: "Hãy nghĩ đến MỘT thương hiệu/chuỗi bán lẻ (bất kỳ ngành nào) mà bạn đã mua hoặc nhận hàng trực tiếp tại cửa hàng trong 6 tháng qua. Nếu có nhiều nơi, chọn nơi bạn mua thường xuyên nhất."
      options:
        - "Circle K (Cửa hàng tiện lợi)"
        - "7-Eleven (Cửa hàng tiện lợi)"
        - "FamilyMart (Cửa hàng tiện lợi)"
        - "GS25 (Cửa hàng tiện lợi)"
        - "B's Mart (Cửa hàng tiện lợi)"
        - "Uniqlo (Thời trang)"
        - "H&M (Thời trang)"
        - "Zara (Thời trang)"
        - "Canifa (Thời trang)"
        - "Routine (Thời trang)"
        - "Owen (Thời trang)"
        - "WinMart / WinMart+ (Siêu thị)"
        - "Bách Hóa Xanh (Siêu thị)"
        - "Co.opmart (Siêu thị)"
        - "AEON (Siêu thị)"
        - "Lotte Mart (Siêu thị)"
        - "Khác (ghi rõ ở ô bên dưới)"
        - "Tôi chưa từng mua trực tiếp tại cửa hàng của thương hiệu nào → DỪNG KHẢO SÁT"
    validations:
      required: false
  - type: input
    id: sc1_other
    attributes:
      label: "SC1b. Nếu chọn \"Khác\", ghi rõ tên thương hiệu"
    validations:
      required: false
  - type: dropdown
    id: sc2
    attributes:
      label: "SC2. Trong 6 tháng qua, bạn đã từng dùng ứng dụng hoặc website của chính thương hiệu bạn chọn ở SC1 để xem sản phẩm, đặt hàng hoặc tra cứu ưu đãi chưa?"
      options:
        - "Có (tiếp tục khảo sát)"
        - "Chưa từng (DỪNG KHẢO SÁT)"
    validations:
      required: false
  - type: dropdown
    id: sc3
    attributes:
      label: "SC3. Khi mua tại cửa hàng của thương hiệu ở SC1, bạn có đọc số điện thoại, quét mã thành viên hoặc đăng nhập tài khoản (cùng tài khoản dùng trên app/website) để tích điểm hoặc nhận ưu đãi không?"
      options:
        - "Thường xuyên"
        - "Thỉnh thoảng"
        - "Hiếm khi"
        - "Không bao giờ (DỪNG KHẢO SÁT)"
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ⚠️ **ĐIỀU KIỆN DỪNG:** nếu ở SC1 bạn chọn "Tôi chưa từng mua trực tiếp...", hoặc ở SC2 chọn "Chưa từng", hoặc ở SC3 chọn "Không bao giờ" thì **hãy bấm Submit ngay, KHÔNG cần trả lời các câu bên dưới.** Cảm ơn bạn đã dành thời gian!
